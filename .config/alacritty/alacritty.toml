[font]
size = 12.0

[window]
opacity = 0.5
blur = true
padding = { x = 2, y = 2 }

[font.normal]
family = "FiraCode"
style = "Regular"

[font.bold]
family = "FiraCode"
style = "Bold"

[colors.primary]
background = "#0b0e14"
foreground = "#c8d6e5"

[colors.normal]
black   = "#1a1f2e"
red     = "#e06c75"
green   = "#98c379"
yellow  = "#e5c07b"
blue    = "#61afef"
magenta = "#c678dd"
cyan    = "#56b6c2"
white   = "#abb2bf"

[colors.bright]
black   = "#5c6370"
red     = "#e06c75"
green   = "#98c379"
yellow  = "#e5c07b"
blue    = "#61afef"
magenta = "#c678dd"
cyan    = "#56b6c2"
white   = "#ffffff"
